apiVersion: {{ include "common.capabilities.cronjob.apiVersion" . }}
kind: CronJob
metadata:
  name: {{ template "k8s-helm-backup.cronjob" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.commonAnnotations }}
      {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
      {{- end }}
  labels: {{- include "common.labels.standard" $ | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}

spec:
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 60  # remove jobs which are successfully executed
  failedJobsHistoryLimit: 60      # except 1 recent failed job, remove jobs which are not successfully executed
  #schedule: '*/3 * * * *' # cron spec of time
  schedule: {{ .Values.crontime }}
  jobTemplate:
    spec:
      backoffLimit: 0 # this has very low chance of failing, as all this does
                      # is prompt kubernetes to schedule new replica set for
      # the deployment
      # activeDeadlineSeconds: 600 # timeout, makes most sense with
      # "waiting for rollout" variant specified below
      template:
        spec:
          {{ - if .Values.nodeSelector }}
          nodeSelector: {{ - include "common.tplvalues.render" ( dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
          {{ - end }}
          # account configured above
          serviceAccountName: {{ template "k8s-helm-backup.serviceAccountName" $ }}
          restartPolicy: Never
          initContainers:
            {{- if and .Values.volumePermissions.enabled .Values.persistence.enabled }}
            - name: volume-permissions
              image: {{ template "k8s-helm-backup.image" . }}
              imagePullPolicy: {{ .Values.volumePermissions.image.pullPolicy | quote }}
              command:
                - /bin/bash
                - -c
                - chown -R 1000:1000 {{ .Values.persistence.mountDir }}
              securityContext:
                runAsUser: 0
              {{- if .Values.volumePermissions.resources }}
              resources: {{- toYaml .Values.volumePermissions.resources | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: {{ template "common.names.fullname" $ }}
                  mountPath: {{ .Values.persistence.mountDir }}
              {{- end }}

          containers:
          - name: {{ template "k8s-helm-backup.serviceAccountName" . }}
            image: {{ template "k8s-helm-backup.image" . }}
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            {{- if .Values.lifecycleHooks }}
            lifecycle: {{- include "common.tpvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
            {{- end }}
            {{- if .Values.containerSecurityContext.enabled }}
            securityContext: {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
            {{- end }}
            {{- if .Values.command }}
            command: {{- include "common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
            {{- end }}
            {{- if .Values.args }}
            args: {{- include "common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
            {{- end }}
            env:
              {{- if .Values.extraEnvVars }}
              {{- include "common.tpvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
              {{- end }}

            envFrom:
              {{- if .Values.extraEnvVarsCM }}
              {{- range .Values.extraEnvVarsCM }}
                  - configMapRef:
                        name: {{ . }}
              {{- end }}
              {{- end }}
              {{- if .Values.extraEnvVarsSecret }}
              {{- range .Values.extraEnvVarsSecret }}
                  - secretRef:
                        name: {{ . }}
              {{- end }}
              {{- end }}
            volumeMounts:
              {{- if .Values.persistence.enabled }}
              - name: {{ template "common.names.fullname" . }}
                mountPath: {{ .Values.persistence.mountDir }}
              {{- end }}
          volumes:
          {{- if .Values.persistence.enabled }}
          - name: {{ template "common.names.fullname" . }}
            persistentVolumeClaim:
              claimName: {{ template "common.names.fullname" . }}-pvc
          {{- end }}
